<title>Hazır Mahalle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Nunito:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: the app comes first as a phone-width column; demo controls fold into a small panel under it. Emergency mode is a full-screen deep-blue layer with bright, colour-coded buttons. */
:root {
  --bg: #F2F7FA;
  --surface: #FFFFFF;
  --surface-2: #EAF3F7;
  --ink: #15304A;
  --muted: #4D6476;
  --line: #D5E3EB;
  --primary: #0A8576;
  --primary-soft: #DCF3EE;
  --primary-ink: #FFFFFF;
  --signal: #FFB547;
  --signal-ink: #3A2500;
  --sun-soft: #FFF1DA;
  --go: #12814A;
  --go-soft: #DCF4E6;
  --warn: #A85800;
  --warn-soft: #FFEFD6;
  --crit: #D63C3C;
  --crit-soft: #FDE5E4;
  --sky: #2F7FE6;
  --rose-soft: #FCE8EF; --rose: #B8335E;
  --blue-soft: #E3EEFF; --blue: #2D63C8;
  --park: #BDE8C6;
  --park-line: #43A866;
  --street: #FFFFFF;
  --block: #E3ECF1;
  --font-display: "Nunito", "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 16px;
  --base: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1C2A; --surface: #162737; --surface-2: #1C3245; --ink: #EAF2F8; --muted: #A6B9C8; --line: #29435A;
    --primary: #3CC6B4; --primary-soft: #133A39; --primary-ink: #04201C; --signal: #FFC266; --signal-ink: #2E1D00; --sun-soft: #3A2D14;
    --go: #4CD38A; --go-soft: #143A28; --warn: #FFB25C; --warn-soft: #3A2A12; --crit: #FF7A70; --crit-soft: #3E1D20; --sky: #6AA8FF;
    --rose-soft: #3A1E2A; --rose: #FF8FB4; --blue-soft: #1B2F52; --blue: #8DB4FF;
    --park: #1D4A33; --park-line: #4CAF6E; --street: #2A4256; --block: #1A2E40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1C2A; --surface: #162737; --surface-2: #1C3245; --ink: #EAF2F8; --muted: #A6B9C8; --line: #29435A;
  --primary: #3CC6B4; --primary-soft: #133A39; --primary-ink: #04201C; --signal: #FFC266; --signal-ink: #2E1D00; --sun-soft: #3A2D14;
  --go: #4CD38A; --go-soft: #143A28; --warn: #FFB25C; --warn-soft: #3A2A12; --crit: #FF7A70; --crit-soft: #3E1D20; --sky: #6AA8FF;
  --rose-soft: #3A1E2A; --rose: #FF8FB4; --blue-soft: #1B2F52; --blue: #8DB4FF;
  --park: #1D4A33; --park-line: #4CAF6E; --street: #2A4256; --block: #1A2E40;
  color-scheme: dark;
}
:root.big { --base: 18px; }
html { font-size: var(--base); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
:root[lang="ar"] body { font-family: var(--font-ar); }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* demo panel */
.proto { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.proto summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; min-height: 52px; font-weight: 600; font-size: .92rem; }
.proto summary::-webkit-details-marker { display: none; }
.proto summary .state { margin-inline-start: auto; color: var(--muted); font-weight: 400; font-size: .82rem; display: flex; align-items: center; gap: 6px; }
.proto summary .chev { transition: transform .2s; color: var(--muted); }
.proto[open] summary .chev { transform: rotate(180deg); }
.demo-badge { background: var(--blue-soft); color: var(--blue); font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; letter-spacing: .04em; }
.proto-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.proto-body p { font-size: .82rem; color: var(--muted); }
.proto-row { display: flex; flex-direction: column; gap: 6px; }
.proto-row label { font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; border-radius: 9px; padding: 6px 10px; font-size: .85rem; min-height: 40px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(21,48,74,.15); }

/* app frame */
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; min-height: 640px; box-shadow: 0 12px 32px -18px rgba(21,48,74,.35); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 12px; flex-wrap: wrap; background: linear-gradient(180deg, var(--primary-soft), var(--surface)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 38px; height: 38px; border-radius: 12px; background: var(--primary); display: grid; place-items: center; flex: none; }
.mark svg { width: 22px; height: 22px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.05; margin: 0; }
.brand small { display: block; color: var(--muted); font-size: .78rem; }
.top-tools { display: flex; gap: 6px; align-items: center; }
.lang { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
.lang button { border: 0; background: transparent; min-width: 38px; min-height: 36px; border-radius: 8px; font-weight: 700; font-size: .85rem; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; min-width: 44px; min-height: 42px; font-weight: 800; font-size: .95rem; }
.chip-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

.statusbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: .82rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.internet { background: var(--go); } .dot.sms { background: var(--signal); } .dot.mesh { background: var(--sky); } .dot.none { background: var(--crit); }
.statusbar .q { margin-inline-start: auto; color: var(--muted); }

main { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; margin: 0; line-height: 1.15; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.card.tint { background: var(--surface-2); border-color: transparent; }
.row { display: flex; gap: 12px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.eyebrow { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
:root[lang="ar"] .eyebrow { letter-spacing: 0; }
.hello h2 { font-size: 1.55rem; }

/* score */
.score { display: flex; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.track { stroke: var(--surface-2); } .fill { stroke: var(--primary); transition: stroke-dashoffset .4s ease; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 48px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.signal { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: .88rem; }
.alarm { background: var(--crit); color: #fff; border: 0; border-radius: 18px; padding: 14px 16px; min-height: 72px; width: 100%; display: flex; align-items: center; gap: 14px; text-align: start; box-shadow: 0 10px 22px -12px var(--crit); }
.alarm .ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.alarm b { display: block; font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; }
.alarm span { font-size: .82rem; opacity: .92; }
:root[lang="ar"] .alarm b, :root[lang="ar"] h2, :root[lang="ar"] .brand h1 { font-family: var(--font-ar); }

/* quick tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 0; border-radius: var(--radius); padding: 14px; min-height: 104px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; text-align: start; }
.tile .ti { width: 38px; height: 38px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; }
.tile .ti svg { width: 22px; height: 22px; }
.tile b { font-size: 1rem; }
.tile small { display: block; font-size: .8rem; color: var(--muted); }
.tile.kit { background: var(--sun-soft); } .tile.kit .ti { color: var(--warn); }
.tile.fam { background: var(--rose-soft); } .tile.fam .ti { color: var(--rose); }
.tile.map { background: var(--primary-soft); } .tile.map .ti { color: var(--primary); }
.tile.board { background: var(--blue-soft); } .tile.board .ti { color: var(--blue); }

/* tabs */
nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px 8px; }
nav.tabs button { border: 0; background: transparent; padding: 4px 2px; min-height: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .74rem; color: var(--muted); }
nav.tabs button .pill { width: 54px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
nav.tabs button[aria-current="page"] .pill { background: var(--primary-soft); color: var(--primary); }

/* checklist */
.check { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.list { display: flex; flex-direction: column; gap: 6px; }
.check input { width: 26px; height: 26px; accent-color: var(--primary); flex: none; margin: 0; }
.check label { flex: 1; min-width: 0; cursor: pointer; padding-block: 4px; }
.check.done { background: var(--go-soft); }
.check.done label { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.tag.go { background: var(--go-soft); color: var(--go); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.crit { background: var(--crit-soft); color: var(--crit); }
.tag.sig { background: var(--sun-soft); color: var(--warn); }

/* board */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 40px; white-space: nowrap; font-size: .85rem; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.post { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.post.verified { border-color: transparent; background: var(--go-soft); }
.post.stale { background: var(--surface-2); }
.post-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.post-head .when { margin-inline-start: auto; font-size: .78rem; color: var(--muted); }
.cat-ico { width: 38px; height: 38px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
.cat-ico svg { width: 20px; height: 20px; }
.steps { display: flex; gap: 4px; font-size: .74rem; }
.steps span { flex: 1; text-align: center; padding: 4px 0; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.steps span.on { background: var(--primary); color: var(--primary-ink); font-weight: 700; }

/* map */
.mapbox { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--block); }
.mapbox svg { display: block; width: 100%; height: auto; }
.m-street { stroke: var(--street); }
.m-block { fill: var(--block); }
.m-park { fill: var(--park); stroke: var(--park-line); stroke-width: 1.5; }
.m-park.near { stroke: var(--primary); stroke-width: 3; }
.m-label { fill: var(--ink); font-size: 10px; font-weight: 700; font-family: var(--font-body); }
.m-you { fill: var(--sky); stroke: #fff; stroke-width: 3; }
.m-route { stroke: var(--primary); stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
.m-compass { fill: var(--surface); }
.afet .m-compass { fill: #1A3A66; }
.m-meet { fill: var(--signal); stroke: var(--ink); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-inline-end: 4px; }
.compass { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.compass svg { width: 28px; height: 28px; transition: transform .3s; }
.big-num { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* family */
.person { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; font-weight: 800; flex: none; }
.idcard { border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--signal); color: var(--signal-ink); }
.idcard .big { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; line-height: 1.05; }
:root[lang="ar"] .idcard .big { font-family: var(--font-ar); }
.idcard .phone { font-family: var(--font-mono); font-size: 1.05rem; user-select: all; }
select.full, input.full, textarea.full { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; min-height: 48px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .85rem; font-weight: 700; }

/* emergency layer — deep blue for night use, bright colour-coded actions */
.afet {
  position: fixed; inset: 0; z-index: 50; background: #12305A; color: #F4F8FC; overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  --a-line: #2E5689; --a-muted: #C3D4E8; --a-card: #1B3F70;
}
.afet-in { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.afet .conn { display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--a-card); font-weight: 700; flex-wrap: wrap; }
.afet .conn small { color: var(--a-muted); font-weight: 400; }
.afet .conn .cyc { margin-inline-start: auto; border: 1px dashed #8FB2DD; background: transparent; color: #DCE8F6; border-radius: 10px; min-height: 38px; padding: 4px 10px; font-size: .78rem; font-weight: 600; }
.afet .phase { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--a-card); padding: 4px; border-radius: 12px; }
.afet .phase button { border: 0; background: transparent; color: #DCE8F6; border-radius: 9px; padding: 6px 2px; min-height: 44px; font-size: .8rem; }
.afet .phase button[aria-pressed="true"] { background: #FFC145; color: #2E1D00; font-weight: 800; }
.afet .tip { background: #F4F8FC; color: #12305A; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 1.05rem; }
.afet .tip .eyebrow { color: #0A8576; }
.afet .tip .muted { color: #4D6476; }
.afet .tip .btn { background: #EAF3F7; color: #12305A; border-color: transparent; }
.afet .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bigbtn { border: 0; border-radius: 20px; min-height: 124px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 1.2rem; font-weight: 800; text-align: center; box-shadow: 0 8px 18px -10px rgba(0,0,0,.5); }
.bigbtn svg { width: 40px; height: 40px; }
.b-safe { background: #34C77B; color: #06281A; }
.b-help { background: #FFC145; color: #2E1D00; }
.b-area { background: #FFFFFF; color: #12305A; }
.b-sos { background: #FF5A5F; color: #FFFFFF; }
.afet .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.afet .tools button { border: 0; background: var(--a-card); color: #F4F8FC; border-radius: 14px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: .85rem; font-weight: 700; }
.afet .tools button[aria-pressed="true"] { background: #FFC145; color: #2E1D00; }
.afet .tools svg { width: 24px; height: 24px; }
.outbox { display: flex; flex-direction: column; gap: 6px; }
.msg { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--a-card); font-size: .92rem; }
.msg .st { margin-inline-start: auto; font-size: .76rem; font-weight: 700; white-space: nowrap; padding: 3px 8px; border-radius: 999px; }
.st.ok { background: #1E6B48; color: #D8FBE8; } .st.wait { background: #6B4B10; color: #FFE7B3; } .st.go { background: #2E5689; color: #DCE8F6; }
.sheet { background: var(--a-card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sheet .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sheet .opts button { min-height: 68px; border-radius: 14px; border: 0; background: #F4F8FC; color: #12305A; font-weight: 700; font-size: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.sheet .opts button.trap { grid-column: 1 / -1; background: #FF5A5F; color: #FFFFFF; }
.sheet .opts svg { width: 24px; height: 24px; }
.sheet input, .sheet select { background: #F4F8FC; border: 0; color: #12305A; border-radius: 12px; padding: 10px; min-height: 48px; width: 100%; }
.afet .btn { background: #2B5489; color: #F4F8FC; border-color: transparent; }
.afet .btn.signal { background: #FFC145; color: #2E1D00; }
.afet .filters button { background: #F4F8FC; color: #12305A; border-color: transparent; }
.afet .filters button[aria-pressed="true"] { background: #FFC145; color: #2E1D00; }
.num112 { font-family: var(--font-display); font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: .04em; user-select: all; color: #FFFFFF; }
.afet .mapbox { background: #1A3A66; border-color: var(--a-line); }
.afet .m-block { fill: #1A3A66; } .afet .m-street { stroke: #2E5689; } .afet .m-park { fill: #1F5C45; stroke: #4CD38A; } .afet .m-label { fill: #F4F8FC; } .afet .m-route { stroke: #FFC145; } .afet .m-park.near { stroke: #FFC145; }
.afet .muted { color: var(--a-muted); }
.afet .tag { background: #2B5489; color: #F4F8FC; }
.afet .tag.warn { background: #6B4B10; color: #FFE7B3; }

function makeCode() {

  return s;
}
function normCode(v) {
  var c = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  return c.length ? 'HM-' + c.slice(0, 4) + (c.length > 4 ? '-' + c.slice(4) : '') : '';

    if (p.mine && p.sync) h += '<p class="small"><span class="tag ' + (p.sync === 'q' ? 'warn' : 'go') + '">' + t(p.sync === 'q' ? 'syncQ' : p.sync === 'mesh' ? 'syncMesh' : 'syncOk') + '</span></p>';
    if (stale) h += '<p class="small"><span class="tag warn">!</span> ' + t('stale') + '</p>';

    if (p.byMe && p.status === 'claimed') h += '<button class="btn sm primary" data-act="deliver" data-v="' + p.id + '">' + t('deliver') + '</button>';
    h += '</div>';
  });
  return h;
}
function needForm(dark) {
  var h = '<div class="' + (dark ? 'sheet' : 'card') + '"><h3>' + t('helpQ') + '</h3><div class="filters" role="group">';
  CATS.forEach(function (c) { h += '<button data-act="needcat" data-v="' + c + '" aria-pressed="' + (st.needCat === c) + '">' + t(c) + '</button>'; });
  h += '</div><label class="field" for="needQty"><span>' + t('qty') + '</span><input class="full" id="needQty" type="number" min="1" max="99" value="2" inputmode="numeric"></label>';

  return h;
}

/* ---------- emergency layer ---------- */
function vAfet() {
  var c = st.conn, wait = st.outbox.filter(function (m) { return m.status === 'wait'; }).length;
  var h = '<div class="afet" role="dialog" aria-modal="true" aria-label="' + esc(t('openAfet')) + '"><div class="afet-in">';
  h += '<div class="conn"><span class="dot ' + c + '"></span><span>' + t(c) + '<br><small>' + (c === 'mesh' ? t('meshN', { n: st.region === 'ist' ? '4–9' : '0–3' }) : wait ? t('queued', { n: wait }) : t('allSent')) + '</small></span><button class="cyc" data-act="cycle">' + t('cycle') + '</button></div>';
  if (st.sheet === 'help') {
    h += '<div class="sheet"><h3 style="font-size:1.2rem">' + t('helpQ') + '</h3><div class="opts"><button class="trap" data-act="trapped">' + I.sos + t('trapped') + '</button>';
    CATS.forEach(function (k) { h += '<button data-act="quickneed" data-v="' + k + '">' + I[k] + t(k) + '</button>'; });
    h += '</div><button class="btn" data-act="sheet-close">' + t('back') + '</button></div>';
  } else if (st.sheet === 'trapped' || st.sheet === 'sos') {
    var tr = st.sheet === 'trapped';
    h += '<div class="sheet" style="align-items:flex-start"><div class="eyebrow" style="color:#F5C518">' + t(tr ? 'trappedTitle' : 'sosTitle') + '</div><div class="num112">112</div><p>' + t(tr ? 'trappedBody' : 'sosBody') + '</p><div class="row" style="width:100%"><a class="btn signal grow" href="tel:112" style="text-decoration:none">' + t('call') + '</a><button class="btn" data-act="sheet-close">' + t('back') + '</button></div></div>';
  } else if (st.sheet === 'need') {
    h += needForm(true);
  } else if (st.sheet === 'area') {
    h += vMap(true) + '<button class="btn" data-act="sheet-close">' + t('back') + '</button>';
  } else {
    h += '<div><div class="eyebrow" style="color:#A9B4AF;margin-bottom:6px">' + t('since') + '</div><div class="phase" role="group">';
    for (var i = 0; i < 4; i++) h += '<button data-act="phase" data-v="' + i + '" aria-pressed="' + (st.phase === i) + '">' + t('p' + i) + '</button>';
    h += '</div></div>';
    var tip = t('tip' + st.phase) + (st.phase >= 2 && st.region === 'mal' ? ' ' + t('tipMal') : '') + (st.phase === 0 && st.region === 'ist' ? ' ' + t('tipIst') : '');
    h += '<div class="tip"><div class="row"><div class="eyebrow grow">' + t('p' + st.phase) + '</div><button class="btn sm" data-act="speak" aria-label="' + t('read') + '">' + I.speak + t('read') + '</button></div><p id="tipText">' + esc(tip) + '</p></div>';
    h += '<div class="grid4"><button class="bigbtn b-safe" data-act="safe">' + I.safe + t('safe') + '</button><button class="bigbtn b-help" data-act="help">' + I.help + t('help') + '</button><button class="bigbtn b-area" data-act="area">' + I.map + t('area') + '</button><button class="bigbtn b-sos" data-act="sos">' + I.sos + t('sos') + '</button></div>';
    h += '<div class="tools"><button data-act="whistle" aria-pressed="' + st.whistle + '">' + I.whistle + t('whistle') + '</button><button data-act="torch">' + I.torch + t('torch') + '</button><button data-act="afet-close" aria-label="' + t('exitFull') + '">' + I.exit + t('exit') + '</button></div>';
  }
  if (st.outbox.length) {
    h += '<div class="outbox"><div class="eyebrow" style="color:#A9B4AF">' + t('outbox') + '</div>';
    st.outbox.slice().reverse().forEach(function (m) {
      var cls = m.status === 'ok' ? 'ok' : m.status === 'wait' ? 'wait' : 'go';
      var lab = m.status === 'ok' ? (m.via === 'net' ? t('viaNet') : m.via === 'sms' ? t('viaSms') : t('viaMesh', { n: m.n })) : m.status === 'wait' ? t('waiting') : m.status === 'undo' ? t('undoWin') : t('sending');
      h += '<div class="msg">' + (m.kind === 'safe' ? I.safe.replace('<svg', '<svg width="20" height="20"') : I[m.cat].replace('<svg', '<svg width="20" height="20"')) + '<span>' + esc(m.text) + '</span><span class="st ' + cls + '">' + lab + '</span></div>';
    });
    h += '</div>';
  }
  return h + '</div></div>';
}

/* ---------- whistle (Web Audio, starts from a tap) ---------- */
var audio = null, whistleTimer = null;
function startWhistle() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    var pattern = [1, 1, 1, 3, 3, 3, 1, 1, 1], i = 0;
    var beep = function () {
      if (!st.whistle) return;
      var len = pattern[i % pattern.length] * 0.18, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = 3150; g.gain.value = 0.0001;
      o.connect(g); g.connect(audio.destination);
      var now = audio.currentTime; g.gain.exponentialRampToValueAtTime(0.5, now + 0.02); g.gain.setValueAtTime(0.5, now + len); g.gain.exponentialRampToValueAtTime(0.0001, now + len + 0.03);
      o.start(now); o.stop(now + len + 0.05);
      i++; whistleTimer = setTimeout(beep, (len + 0.16) * 1000 + (i % 9 === 0 ? 900 : 0));
    };
    beep();
  } catch (e) { st.whistle = false; }
}
function stopWhistle() { clearTimeout(whistleTimer); }

/* ---------- render ---------- */
function render() {
  var root = document.documentElement;
  root.lang = st.lang; root.dir = st.lang === 'ar' ? 'rtl' : 'ltr';
  root.classList.toggle('big', !!st.big);
  root.classList.toggle('afet-on', !!st.afet);
  var wait = st.outbox.filter(function (m) { return m.status === 'wait'; }).length;
  var h = '<div class="app"><header class="top"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l5-4 4 3 4-3 5 4v10"/><path d="M9 20v-5h6v5"/></svg></div><div><h1>Hazır Mahalle</h1><small>' + t('sub') + '</small></div></div>';
  h += '<div class="top-tools"><div class="lang" role="group" aria-label="Dil / Language / اللغة">';
  [['tr', 'TR', 'Türkçe'], ['ar', 'ع', 'العربية'], ['en', 'EN', 'English']].forEach(function (l) { h += '<button data-act="lang" data-v="' + l[0] + '" aria-pressed="' + (st.lang === l[0]) + '" aria-label="' + l[2] + '" lang="' + l[0] + '">' + l[1] + '</button>'; });
  h += '</div><button class="chip-btn" data-act="big" aria-pressed="' + !!st.big + '" aria-label="' + t('big') + '" title="' + t('big') + '">A+</button></div></header>';
  var ready = st.me && (st.locPerm === 'granted' || st.locPerm === 'once');
  h += '<div class="statusbar"><span class="dot ' + st.conn + '"></span>' + t(st.conn) + ' · ' + t(st.region) + (ready ? locLine(true) : '') + '<span class="q">' + (wait ? t('queued', { n: wait }) : t('allSent')) + '</span></div>';
  h += '<main id="main">';
  if (!st.me) h += vRegister();
  else if (!ready) h += vLocGate();
  else h += st.tab === 'home' ? vHome() : st.tab === 'kit' ? vKit() : st.tab === 'family' ? vFamily() : st.tab === 'map' ? vMap(false) : vBoard();
  h += '</main>';
  if (ready) {
    h += '<nav class="tabs" aria-label="' + t('tHome') + '">';
    [['home', 'tHome', I.home], ['kit', 'tKit', I.kit], ['family', 'tFam', I.fam], ['map', 'tMap', I.map], ['board', 'tBoard', I.board]].forEach(function (x) {
      h += '<button data-act="tab" data-v="' + x[0] + '"' + (st.tab === x[0] ? ' aria-current="page"' : '') + '><span class="pill">' + x[2] + '</span><span>' + t(x[1]) + '</span></button>';
    });
    h += '</nav>';
  }
  h += '</div>';
  h += '<details class="proto" id="demo"' + (st.demoOpen ? ' open' : '') + '><summary><span class="demo-badge">DEMO</span>' + t('demo') + '<span class="state"><span class="dot ' + st.conn + '"></span>' + t(st.conn) + ' · ' + t(st.region) + '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></summary><div class="proto-body"><p>' + t('demoNote') + '</p>';
  h += '<div class="proto-row"><label>' + t('conn') + '</label><div class="seg" role="group">';
  ['internet', 'sms', 'mesh', 'none'].forEach(function (c) { h += '<button data-act="conn" data-v="' + c + '" aria-pressed="' + (st.conn === c) + '">' + t(c) + '</button>'; });
  h += '</div></div><div class="proto-row"><label>' + t('region') + '</label><div class="seg" role="group">';
  ['mal', 'ist'].forEach(function (r) { h += '<button data-act="region" data-v="' + r + '" aria-pressed="' + (st.region === r) + '">' + t(r) + '</button>'; });
  h += '</div></div><p>' + t('demoCodes', { c: Object.keys(DIRECTORY).join(', ') }) + '</p><button class="btn sm" data-act="reopen">' + t('reopen') + '</button></div></details><p class="foot">' + t('foot') + '</p>';
  document.getElementById('root').innerHTML = h;
  var d = document.getElementById('demo');
  if (d) d.addEventListener('toggle', function () { st.demoOpen = d.open; });
  renderLayer();
}
function renderLayer() {
  var h = '';
  if (st.afet) h += vAfet();
  if (st.osDialog) h += osDialog();
  if (st.torch) h += '<button class="torch" data-act="torch-off">' + t('torchOff') + '</button>';
  if (st.toast) h += '<div class="toast" role="status"><span>' + esc(st.toast.text) + '</span>' + (st.toast.action ? '<button data-act="undo">' + t('undo') + '</button>' : '') + '</div>';
  document.getElementById('layer').innerHTML = h;
}

/* ---------- events ---------- */
var undoTimer = null;
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  switch (a) {
    case 'lang': st.lang = v; save('lang', v); if (!st.me) st.regDraft = readReg(); render(); break;
    case 'loc-ask': st.osDialog = true; renderLayer(); var fb = document.querySelector('.osdlg button'); if (fb) fb.focus(); break;
    case 'loc-res': st.osDialog = false; st.locPerm = v; if (v !== 'denied') newFix(false); render(); window.scrollTo(0, 0); break;
    case 'relocate': newFix(true); toast(st.conn === 'none' ? t('locNoNet') : t('locUpdated')); render(); break;
    case 'reopen': st.locPerm = null; st.afet = false; st.sheet = null; render(); window.scrollTo(0, 0); break;
    case 'copy':
      var codeTxt = st.me.code;
      try { navigator.clipboard.writeText(codeTxt).then(function () { toast(t('copied')); }, function () { selectCode(); toast(t('copyFail')); }); }
      catch (err) { selectCode(); toast(t('copyFail')); }
      break;
    case 'inc-ok': var qi = st.incoming.splice(+v, 1)[0]; if (qi) { st.fam.push({ code: qi.code, name: qi.name, ini: qi.ini, safe: null }); saveFam(); toast(t('approved', { n: qi.name })); } render(); break;
    case 'inc-no': st.incoming.splice(+v, 1); saveFam(); toast(t('rejected')); render(); break;
    case 'del-ask': st.confirmDel = true; render(); break;
    case 'del-no': st.confirmDel = false; render(); break;
    case 'del-yes':
      ['me', 'fam', 'reqs', 'incoming', 'fix', 'kit', 'meet'].forEach(function (k) { try { localStorage.removeItem('hm_' + k); } catch (err) {} });
      st.me = null; st.fam = JSON.parse(JSON.stringify(FAM_SEED)); st.reqs = []; st.incoming = [{ code: 'HM-QQUS-YH6Z', name: 'Selin Yılmaz', ini: 'S' }]; st.fix = null; st.locPerm = null; st.confirmDel = false; st.tab = 'home';
      render(); window.scrollTo(0, 0); break;
    case 'cycle': var order = ['internet', 'sms', 'mesh', 'none'], nx = order[(order.indexOf(st.conn) + 1) % 4]; st.conn = nx; if (nx !== 'none') { flushQueue(); flushReqs(); } if (nx === 'mesh') toast(t('meshN', { n: st.region === 'ist' ? '4–9' : '0–3' })); render(); break;
    case 'tab': st.tab = v; st.sheet = null; render(); window.scrollTo(0, 0); break;
    case 'conn': var was = st.conn; st.conn = v; if (v !== 'none' && was !== v) { flushQueue(); flushReqs(); } if (v === 'mesh') toast(st.region === 'ist' ? t('meshN', { n: '4–9' }) : t('meshN', { n: '0–3' })); render(); break;
    case 'region': st.region = v; save('region', v); st.sheet = null; st.filter = 'all'; render(); break;
    case 'big': st.big = !st.big; save('big', st.big); render(); break;
    case 'afet-open': st.afet = true; st.sheet = null; render(); break;
    case 'afet-close': st.afet = false; st.sheet = null; st.whistle = false; stopWhistle(); render(); break;
    case 'phase': st.phase = +v; renderLayer(); break;
    case 'safe':
      var m = { id: st.seq++, kind: 'safe', text: t('safeMsg'), status: 'undo' };
      st.outbox.push(m);
      clearTimeout(undoTimer);
      undoTimer = setTimeout(function () { if (m.status === 'undo') { dispatch(m); render(); } }, 5000);
      st.lastUndo = m; toast(t('safeToast'), 'undo'); render(); break;
    case 'undo':
      if (st.lastUndo && st.lastUndo.status === 'undo') { st.outbox = st.outbox.filter(function (x) { return x !== st.lastUndo; }); clearTimeout(undoTimer); toast(t('undone')); }
      render(); break;
    case 'help': st.sheet = 'help'; renderLayer(); break;
    case 'trapped': st.sheet = 'trapped'; renderLayer(); break;
    case 'sos': st.sheet = 'sos'; renderLayer(); break;
    case 'area': st.sheet = 'area'; renderLayer(); break;
    case 'quickneed': st.needCat = v; st.sheet = 'need'; renderLayer(); break;
    case 'need-open': st.sheet = 'need'; render(); break;
    case 'needcat': st.needCat = v; if (st.afet) renderLayer(); else render(); break;
    case 'sheet-close': st.sheet = (st.afet && st.sheet === 'need') ? 'help' : null; if (st.afet) renderLayer(); else render(); break;
    case 'need-post': postNeed(); break;
    case 'mapview': st.mapView = v; if (st.afet) renderLayer(); else render(); break;
    case 'filter': st.filter = v; render(); break;
    case 'claim':
      if (st.mineClaims >= 3) { toast(t('maxClaims')); break; }
      var p = findPost(v); if (p) { p.status = 'claimed'; p.byMe = true; st.mineClaims++; } render(); break;
    case 'deliver': var q = findPost(v); if (q) { q.status = 'done'; st.mineClaims = Math.max(0, st.mineClaims - 1); } render(); break;
    case 'torch': st.torch = true; renderLayer(); break;
    case 'torch-off': st.torch = false; renderLayer(); break;
    case 'whistle': st.whistle = !st.whistle; if (st.whistle) startWhistle(); else stopWhistle(); renderLayer(); break;
    case 'speak':
      try { var u = new SpeechSynthesisUtterance(document.getElementById('tipText').textContent); u.lang = st.lang === 'ar' ? 'ar-SA' : st.lang === 'en' ? 'en-GB' : 'tr-TR'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (err) {}
      break;
  }
});
function selectCode() { var el = document.getElementById('myCode'); if (!el) return; try { var r = document.createRange(); r.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (err) {} }
document.addEventListener('submit', function (e) {
  if (e.target.id === 'regForm') { e.preventDefault(); submitReg(); }
  else if (e.target.id === 'codeForm') { e.preventDefault(); submitCode(); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'codeIn') { var n = normCode(e.target.value); if (n !== e.target.value) e.target.value = n; st.codeDraft = n; }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'rIl') { st.regDraft = readReg(); st.regDraft.ilce = ''; st.region = el.value; render(); var f = document.getElementById('rIl'); if (f) f.focus(); return; }
  if (el.dataset.kit) { st.kit[el.dataset.kit] = el.checked; save('kit', st.kit); render(); var f = document.getElementById('k_' + el.dataset.kit); if (f) f.focus(); return; }
  if (el.dataset.meet) { st.meet[st.region] = el.value; save('meet', st.meet); render(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (st.torch) { st.torch = false; renderLayer(); } else if (st.sheet) { st.sheet = null; if (st.afet) renderLayer(); else render(); } } });

function postNeed() {
  var qEl = document.getElementById('needQty'), nEl = document.getElementById('needNote');
  var qty = Math.max(1, Math.min(99, parseInt(qEl && qEl.value, 10) || 1)), note = (nEl && nEl.value || '').trim();
  var id = 'u' + (st.seq++);
  var post = { id: id, cat: st.needCat, qty: qty, unit: 'pcs', age: 0, status: 'open', mine: true, tr: note, en: note, ar: note, sync: 'q' };
  st.board[st.region].splice(1, 0, post);
  var m = { id: st.seq++, kind: 'need', cat: st.needCat, postId: id, text: t(st.needCat) + ' · ' + t('pcs', { n: qty }), status: 'go' };
  st.outbox.push(m);
  dispatch(m);
  var msg = m.status === 'ok' ? t('postedOk') : m.status === 'go' ? t('postedMesh', { n: m.n }) : t('postedQ');
  st.sheet = null; if (!st.afet) { st.tab = 'board'; st.filter = 'all'; }
  toast(msg); render();
}

render();
})();
</script>
